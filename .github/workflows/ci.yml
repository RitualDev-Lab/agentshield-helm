name: CI Tests & IaC Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  test:
    name: Helm Lint, Kubeconform & CycloneDX SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.16.2

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar -xz
          sudo mv kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Lint Helm Chart
        run: |
          helm lint charts/agentshield

      - name: Template & Kubeconform Schema Validation
        run: |
          helm template agentshield charts/agentshield | kubeconform -strict -ignore-missing-schemas -summary

      - name: Generate CycloneDX SBOM for Chart Manifests
        run: |
          cat <<'EOF' > sbom-cyclonedx.json
          {
            "bomFormat": "CycloneDX",
            "specVersion": "1.5",
            "version": 1,
            "metadata": {
              "component": {
                "type": "application",
                "name": "agentshield-helm",
                "version": "1.1.0",
                "purl": "pkg:helm/ritualdev/agentshield@1.1.0"
              }
            },
            "components": [
              {
                "type": "container",
                "name": "ghcr.io/ritualdev-lab/agentshield",
                "version": "0.2.2"
              }
            ]
          }
          EOF
          cat sbom-cyclonedx.json
