{{- if .Values.airGapped.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentshield.fullname" . }}-airgap
  labels:
    {{- include "agentshield.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agentshield.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from within namespace and internal cluster
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Strictly restrict egress to authorized internal VPC CIDRs (zero public internet egress)
    {{- range .Values.airGapped.allowedCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . }}
    {{- end }}
{{- end }}
