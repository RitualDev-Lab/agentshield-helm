{{- if .Values.dbshield.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentshield.fullname" . }}-dbshield
  labels:
    {{- include "agentshield.labels" . | nindent 4 }}
    app.kubernetes.io/component: dbshield-proxy
spec:
  replicas: {{ .Values.dbshield.replicaCount | default 3 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "agentshield.name" . }}-dbshield
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "agentshield.name" . }}-dbshield
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: dbshield
          image: "{{ .Values.dbshield.image.repository }}:{{ .Values.dbshield.image.tag | default "0.2.1" }}"
          imagePullPolicy: {{ .Values.dbshield.image.pullPolicy | default "IfNotPresent" }}
          command: ["dbshield", "proxy", "--port=5432", "--mysql-port=3306"]
          env:
            - name: DBSHIELD_AIR_GAPPED
              value: {{ .Values.airGapped.enabled | quote }}
            - name: DBSHIELD_SAFETY_TIER
              value: {{ .Values.dbshield.safetyTier | default "STRICT" | quote }}
            - name: DBSHIELD_RAFT_PEERS
              value: {{ .Values.dbshield.raftPeers | default "" | quote }}
            - name: DBSHIELD_AUDIT_SECRET
              value: {{ .Values.engine.auditSecret | quote }}
          ports:
            - name: pg-wire
              containerPort: 5432
              protocol: TCP
            - name: mysql-wire
              containerPort: 3306
              protocol: TCP
            - name: dashboard
              containerPort: 3100
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.dbshield.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentshield.fullname" . }}-dbshield
  labels:
    {{- include "agentshield.labels" . | nindent 4 }}
    app.kubernetes.io/component: dbshield-proxy
spec:
  type: ClusterIP
  ports:
    - name: pg-wire
      port: 5432
      targetPort: 5432
      protocol: TCP
    - name: mysql-wire
      port: 3306
      targetPort: 3306
      protocol: TCP
    - name: dashboard
      port: 3100
      targetPort: 3100
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "agentshield.name" . }}-dbshield
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
