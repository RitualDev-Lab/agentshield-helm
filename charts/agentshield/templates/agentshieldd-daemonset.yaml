{{- if .Values.daemonset.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "agentshield.fullname" . }}-daemon
  labels:
    {{- include "agentshield.labels" . | nindent 4 }}
    app.kubernetes.io/component: agentshieldd
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "agentshield.name" . }}-daemon
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "agentshield.name" . }}-daemon
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        seccomp.security.alpha.kubernetes.io/pod: "runtime/default"
    spec:
      hostNetwork: false
      hostPID: true
      serviceAccountName: {{ include "agentshield.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      containers:
        - name: agentshieldd
          image: "{{ .Values.daemonset.image.repository }}:{{ .Values.daemonset.image.tag | default .Values.image.tag }}"
          imagePullPolicy: {{ .Values.daemonset.image.pullPolicy | default "IfNotPresent" }}
          command: ["agentshieldd"]
          args:
            - "--socket={{ .Values.daemonset.hostSocketPath }}"
            - "--token={{ .Values.daemonset.authToken }}"
            - "--max-clients={{ .Values.daemonset.maxClients }}"
          securityContext:
            privileged: false
            capabilities:
              add:
                - BPF
                - NET_ADMIN
                - SYS_PTRACE
          env:
            - name: AGENTSHIELD_AIR_GAPPED
              value: {{ .Values.airGapped.enabled | quote }}
            - name: AGENTSHIELD_STRICT_MODE
              value: "true"
          resources:
            {{- toYaml .Values.daemonset.resources | nindent 12 }}
          volumeMounts:
            - name: host-run
              mountPath: /var/run
      volumes:
        - name: host-run
          hostPath:
            path: /var/run
            type: DirectoryOrCreate
      tolerations:
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
{{- end }}
