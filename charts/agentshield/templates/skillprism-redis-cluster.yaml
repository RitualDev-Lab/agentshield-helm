{{- if .Values.skillprism.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentshield.fullname" . }}-skillprism
  labels:
    {{- include "agentshield.labels" . | nindent 4 }}
    app.kubernetes.io/component: skillprism-hub
spec:
  replicas: {{ .Values.skillprism.replicaCount | default 2 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "agentshield.name" . }}-skillprism
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "agentshield.name" . }}-skillprism
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: skillprism
          image: "{{ .Values.skillprism.image.repository }}:{{ .Values.skillprism.image.tag | default "0.2.1" }}"
          imagePullPolicy: {{ .Values.skillprism.image.pullPolicy | default "IfNotPresent" }}
          command: ["skillprism", "hub", "--port=8080"]
          env:
            - name: SKILLPRISM_AIR_GAPPED
              value: {{ .Values.airGapped.enabled | quote }}
            - name: REDIS_URL
              value: {{ .Values.skillprism.redisUrl | default "redis://127.0.0.1:6379" | quote }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.skillprism.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentshield.fullname" . }}-skillprism
  labels:
    {{- include "agentshield.labels" . | nindent 4 }}
    app.kubernetes.io/component: skillprism-hub
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "agentshield.name" . }}-skillprism
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
